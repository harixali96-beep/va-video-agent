name: SH clip job
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      source:
        description: 'video link (Drive / YouTube / direct mp4) or repo path'
        required: true
      count:
        description: 'how many clips (1-10)'
        default: '3'
      min:
        description: 'shortest clip in seconds'
        default: '7'
      max:
        description: 'longest clip in seconds'
        default: '16'
      cta:
        description: 'CTA line'
        default: 'WATCH THE FULL EP ON @CHICKEN WRAP ENT'
      hashtags:
        description: 'hashtags'
        default: '#streamhouselacwe #streamhousela #cwetv'
      hook:
        description: 'hook text override (optional)'
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: sh-clip-job
  cancel-in-progress: false

jobs:
  render:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.title, 'SH CLIP')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          sudo mkdir -p /usr/share/fonts/truetype/custom
          curl -sL -o /tmp/anton.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          sudo cp /tmp/anton.ttf /usr/share/fonts/truetype/custom/Anton-Regular.ttf
          sudo fc-cache -f

      - name: python deps
        run: pip install -r requirements.txt

      - name: render campaign clips
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          IN_SOURCE: ${{ github.event.inputs.source }}
          IN_COUNT: ${{ github.event.inputs.count }}
          IN_MIN: ${{ github.event.inputs.min }}
          IN_MAX: ${{ github.event.inputs.max }}
          IN_CTA: ${{ github.event.inputs.cta }}
          IN_HASHTAGS: ${{ github.event.inputs.hashtags }}
          IN_HOOK: ${{ github.event.inputs.hook }}
          SH_WORK: ${{ runner.temp }}/sh
          WHISPER_MODEL: base
        run: python3 pipeline/sh/sh_job.py

      - name: publish clips
        if: always()
        run: |
          git config user.name "sh-agent"
          git config user.email "sh-agent@users.noreply.github.com"
          git add clips shclips.json
          if git diff --cached --quiet; then echo "nothing to publish"; exit 0; fi
          git commit -m "sh clips: ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && break
            echo "push retry $i"; sleep $((i*3))
          done

      - name: comment on request
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - > /tmp/msg.md <<'PY'
          import json, os
          job = {}
          try:
              idx = json.load(open("shclips.json"))
              job = next((j for j in idx.get("jobs", []) if j.get("id") == os.environ["RUN_ID"]), {})
          except Exception as e:
              print("Job finished, status padha nahi ja saka:", e)
          if job.get("error"):
              print("Job fail hua: `" + job["error"] + "`")
              print()
              print("Fix: Drive file ko \"anyone with the link\" karke direct link bhejo, "
                    "ya direct .mp4 URL. YouTube runner ke IP ko block karta hai.")
          elif job.get("clips"):
              print("Clips ready (" + str(len(job["clips"])) + "):")
              print()
              for c in job["clips"]:
                  print("- " + str(c["start"]) + "-" + str(c["end"]) + "s  `" + c["file"] + "`")
              print()
              print("Dekho: https://harixali96-beep.github.io/va-video-agent/streamhouse/ "
                    "(page refresh karo). Title + hashtags har clip ke `.txt` me hain.")
          else:
              print("Job chala par clips nahi bane. Run log dekho: "
                    + os.environ.get("GITHUB_SERVER_URL", "https://github.com") + "/"
                    + os.environ.get("GITHUB_REPOSITORY", "") + "/actions/runs/"
                    + os.environ["RUN_ID"])
          PY
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file /tmp/msg.md
